<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <!-- iOS specific attributes for fullscreen camera access -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AR Shoe Try-On">

  <!-- Prevent notch overlap on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

  <title>AR Virtual Shoe Try-On</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Video element for camera feed (hidden, used as source for pose detection) -->
  <video id="camera-video" playsinline muted autoplay disablepictureinpicture style="display: none;">
  </video>

  <!-- Canvas overlay for Three.js rendering -->
  <canvas id="three-canvas"></canvas>

  <!-- Error message overlay -->
  <div id="error-overlay" class="error-overlay hidden">
    <div class="error-content">
      <p id="error-message"></p>
      <button id="error-close-btn" class="error-close-btn">Dismiss</button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>Initializing AR Camera...</p>
  </div>

  <!-- Three.js library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- MediaPipe Tasks Vision - v0.10.2 (stable version) -->
  <!-- This exposes FilesetResolver and PoseLandmarker as window globals -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2"></script> -->
  <!-- Load MediaPipe (VERY IMPORTANT: must be module) -->
  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/vision_bundle.mjs";

    window.PoseLandmarker = PoseLandmarker;
    window.FilesetResolver = FilesetResolver;

    console.log("MediaPipe loaded");
  </script>

  <!-- Main application module (loaded last, after all dependencies) -->
  <script type="module" src="main.js"></script>
</body>

</html>
